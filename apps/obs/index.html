<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="online booking site" />
    <meta name="theme-color" content="#f5ead8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      UIkit used to be loaded here as vendored UMD script tags: it drove the
      wizard's tab strip and switcher, the offcanvas, the modals and the icons,
      and the components reached for the `UIkit` global imperatively.

      The Organic redesign replaced the wizard with one scrolling page, which
      left nothing calling into it. The dependency, the vendoring script and
      src/composables/wizard.js all went with it — the design is, in its own
      words, plain CSS on plain HTML.

      The theme colour above is Organic's --color-bg.
    -->
    <title>Vegetable - online booking</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
